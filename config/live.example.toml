# Copy to config/live.toml on the Pi. THIS MODE MOVES THE ARM.
#
# Motion tools still require an operator to open a window with
# `piper-agent arm --minutes N` at the rig; this file only sets the bounds
# those commands are checked against. The ceilings in config.py cannot be
# raised from here.
mode = "hardware_live"
run_directory = "../runs"
camera_max_age_s = 1.0
camera_timeout_s = 5.0

[arm]
channel = "can0"
firmware = "v188"

[cameras]
scene_serial = "CC1N16200TF"
wrist_serial = "CC1N16200F9"

[live]
# Speed is capped at 30 in code regardless of what is written here.
speed_percent = 10
# The most any single joint may move in one tool call.
max_joint_step_rad = 0.5
# The most the flange may travel in one move_to_pose call.
max_cartesian_step_m = 0.10
# Physical commands allowed per episode before the model is told to stop and
# report. Enforced on the Pi because neither agent CLI has a turn limit. A
# first pilot ran to 64 actions without finishing.
max_actions_per_episode = 100
# Park pose every trial starts from. Measure it on your own rig: it is where
# the arm rests safely, not a task-ready posture.
# home_joints_rad = [0.0, 0.0, 0.0, 0.64, 0.0, 0.0]
# Cartesian box in the ARM BASE frame, metres. move_to_pose is unavailable
# until both are set. MEASURE THESE against your own table before enabling
# Cartesian motion; the values below are a placeholder, not a verified
# workspace, and a wrong box lets the arm drive into the table.
# The z floor should be the height the arm physically cannot descend below
# without its own base fouling, i.e. roughly the home pose's flange height.
# Set it there and the box simply agrees with the joint limits.
# workspace_min_m = [-0.10, -0.30, 0.14]
# workspace_max_m = [ 0.45,  0.30, 0.40]
