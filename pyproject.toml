[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piper-x-agent"
version = "0.1.0"
description = "Codex tools for a Raspberry Pi connected to a Piper X and two cameras"
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2"]

[project.optional-dependencies]
cameras = ["numpy>=1.26,<3", "opencv-python-headless>=4.10,<5"]

[project.scripts]
piper-agent = "piper_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
